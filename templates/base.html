<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Swandi Pangaribuan{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="{% block meta_description %}Personal blog exploring Technology, Policy, and Innovation.{% endblock %}">
    <link rel="canonical" href="{{ request.url }}">
    
    <meta property="og:site_name" content="Swandi Pangaribuan">
    {% block og_meta %}
    <meta property="og:title" content="Swandi Pangaribuan">
    <meta property="og:description" content="Personal blog of Swandi Pangaribuan">
    <meta property="og:image" content="{{ url_for('static', filename='img/profile.png', _external=True) }}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:type" content="website">
    {% endblock %}
    {% block head %}{% endblock %}
</head>

<body>
    <div class="container">
        <header>
            <div class="header-portrait">
                <img src="{{ url_for('static', filename='img/profile.png') }}" alt="Swandi Pangaribuan">
            </div>
            <a href="/" class="logo">Swandi Pangaribuan</a>

            {% if user %}
            <nav class="nav-links"></nav>
            <span>Hello, {{ user.name }}</span>
            {% if user.role == 'admin' %}
            <a href="/admin">Posts</a>
            <a href="/admin/comments">Moderate</a>
            {% endif %}
            <a href="/profile">Profile</a>
            <a href="/logout">Logout</a>
            </nav>
            {% endif %}

        </header>

        <main class="animate-fade">
            {% block content %}{% endblock %}
        </main>

        <footer
            style="margin-top: 5rem; padding: 2rem 0; text-align: center; color: var(--text-secondary); border-top: 1px solid var(--card-border);">
            <p>&copy; 2026 swandi</p>
        </footer>
    </div>
</body>

</html>
